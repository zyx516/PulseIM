server:
  port: 8084
spring:
  application:
    name: conversation-service
  datasource:
    url: ${CONVERSATION_DB_URL:jdbc:mysql://localhost:3306/pulseim_conversation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${PULSEIM_MYSQL_USER:root}
    password: ${PULSEIM_MYSQL_PASSWORD:pulseim-dev}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
