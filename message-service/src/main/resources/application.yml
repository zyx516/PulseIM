server:
  port: 8085
spring:
  application:
    name: message-service
  datasource:
    url: ${MESSAGE_DB_URL:jdbc:mysql://localhost:3306/pulseim_message?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${PULSEIM_MYSQL_USER:root}
    password: ${PULSEIM_MYSQL_PASSWORD:pulseim-dev}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
pulseim:
  rabbitmq:
    exchange: pulseim.message.events
