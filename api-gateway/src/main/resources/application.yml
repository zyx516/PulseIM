server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - ${PULSEIM_WEB_ORIGIN:http://localhost:5173}
              - http://127.0.0.1:*
              - http://localhost:*
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: '*'
            maxAge: 3600
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates: [Path=/api/auth/**]
        - id: users
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates: [Path=/api/users/**]
        - id: friends
          uri: ${SOCIAL_SERVICE_URI:http://localhost:8083}
          predicates: [Path=/api/friends/**]
        - id: conversations
          uri: ${CONVERSATION_SERVICE_URI:http://localhost:8084}
          predicates: [Path=/api/conversations/**]
        - id: messages
          uri: ${MESSAGE_SERVICE_URI:http://localhost:8085}
          predicates: [Path=/api/messages/**]
        - id: media
          uri: ${MEDIA_SERVICE_URI:http://localhost:8086}
          predicates: [Path=/api/media/**]
        - id: moderation
          uri: ${MODERATION_SERVICE_URI:http://localhost:8087}
          predicates: [Path=/api/moderation/**]
management:
  endpoints:
    web:
      exposure:
        include: health,info
